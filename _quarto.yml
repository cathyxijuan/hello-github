project:
  type: website
  output-dir: _site
  # Only render the website pages (not CLAUDE.md or other repo files)
  render:
    - index.qmd
    - projects.qmd
    - cv.qmd

website:
  title: "Your Name"            # TODO: replace with your name
  site-url: "https://cathyxijuan.github.io/hello-github"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: projects.qmd
        text: Projects
      - href: cv.qmd
        text: CV
    right:
      - icon: github
        href: https://github.com/cathyxijuan
        aria-label: GitHub
  page-footer:
    center: "© 2026 Your Name · Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: false
